name: Verify Production Sitemap

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  verify-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch sitemaps
        run: |
          set -e
          echo "Fetching sitemaps..."
          curl -sS https://ukltdregistration.com/sitemap.xml -o sitemap.xml
          curl -sS https://ukltdregistration.com/priority-sitemap.xml -o priority-sitemap.xml
          echo "Saved sitemap.xml and priority-sitemap.xml"

      - name: Check for problematic slugs
        run: |
          set -e
          PATTERNS=(
            "register-uk-ltd-online-singapore-2026"
            "register-uk-ltd-online-malaysia-2026"
            "register-uk-ltd-online-philippines-2026"
            "register-uk-ltd-online-vietnam-2026"
            "register-uk-ltd-online-indonesia-2026"
            "register-uk-ltd-online-thailand-2026"
            "services/company-secretary"
            "services/confirmation-statement"
            "ltd-company-uk-registration"
            "new-ltd-company-registration"
            "check-company-name-availability-uk"
          )

          FOUND=0
          for sitemap in sitemap.xml priority-sitemap.xml; do
            for p in "${PATTERNS[@]}"; do
              if grep -qF "$p" "$sitemap"; then
                echo "PROBLEMATIC: found $p in $sitemap"
                FOUND=1
              fi
            done
          done

          if [ "$FOUND" -ne 0 ]; then
            echo "One or more problematic slugs were found in the sitemaps"
            exit 1
          fi

          echo "No problematic slugs found in either sitemap"

      - name: Check source for legacy outgoing links
        run: |
          set -e
          if git grep -nF "/check-company-name-availability-uk" -- ':!content/redirects.json'; then
            echo "Legacy company-name-check link found outside the redirect map"
            exit 1
          fi
          echo "No legacy company-name-check links found in source"

      - name: Check WhatsApp links
        run: |
          set -e
          if git grep -nE 'https://wa\.me/' -- ':!content/redirects.json'; then
            echo "WhatsApp short link found in source; use api.whatsapp.com/send"
            exit 1
          fi
          echo "No WhatsApp short links found in source"

      - name: (Optional) Ping Search Engines
        if: ${{ always() }}
        run: |
          echo "Pinging Google and Bing (responses are informational)..."
          curl -sS "https://www.google.com/ping?sitemap=https://ukltdregistration.com/sitemap.xml" || true
          curl -sS "https://www.bing.com/webmaster/ping.aspx?siteMap=https://ukltdregistration.com/sitemap.xml" || true
